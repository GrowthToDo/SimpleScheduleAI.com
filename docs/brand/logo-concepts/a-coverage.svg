<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="SimpleScheduleAI mark, concept A: the covered shift">
  <!--
    Concept A — "The Coverage Mark"
    A schedule of staggered shift bars. One slot was open; the green cell fills it.
    The whole product promise in one glance: the gap in the middle of the roster, covered.
    Light-background variant: ink bars + forest green cell.
  -->
  <g fill="#1A2332">
    <rect x="16" y="18" width="34" height="16" rx="8" />
    <rect x="54" y="18" width="26" height="16" rx="8" />
    <rect x="16" y="40" width="18" height="16" rx="8" />
    <rect x="62" y="40" width="18" height="16" rx="8" />
    <rect x="16" y="62" width="26" height="16" rx="8" />
    <rect x="46" y="62" width="34" height="16" rx="8" />
  </g>
  <rect x="38" y="40" width="20" height="16" rx="8" fill="#2D5A4A" />
</svg>
