[build]
  publish = "dist"
  command = "npm run build"

[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted launch videos: long cache. If a video is ever re-rendered, rename the
# file (e.g. ssai-launch-landscape-v2.mp4) so the immutable cache busts.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Downloadable assets (the free schedule template): short cache so updates
# propagate in minutes; the landing page also versions the link (?v=) to
# bypass Cloudflare's 4h edge cache entirely on updates.
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# 301 from www subdomain to apex so Google consolidates signals on one host.
[[redirects]]
  from = "https://www.simplescheduleai.com/*"
  to = "https://simplescheduleai.com/:splat"
  status = 301
  force = true

# 301 from the raw Netlify subdomain: it was indexed and ranking for the brand
# (found in the Tier-0 unlinked-mention sweep, 2026-07-22), splitting brand
# signals and serving stale-cache copies to search engines.
[[redirects]]
  from = "https://simplescheduleai.netlify.app/*"
  to = "https://simplescheduleai.com/:splat"
  status = 301
  force = true

# Second brand mirror found ranking in search 2026-08-03 (ssai-temp.netlify.app,
# serving index,follow). This rule only takes effect if that Netlify site deploys
# from this repo; if it is a stale manual deploy, it must be deleted or
# password-protected in the Netlify dashboard (founder action).
[[redirects]]
  from = "https://ssai-temp.netlify.app/*"
  to = "https://simplescheduleai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/blog/healthcare-scheduling-crisis-26000-administrative-burden"
  to = "/blog/healthcare-scheduling-crisis"
  status = 301
  force = true

# Deleted landing pages — redirect to homepage so Google drops the 404s
[[redirects]]
  from = "/landing/*"
  to = "/"
  status = 301
  force = true

# /warm-intro redirects to the canonical /ask page
[[redirects]]
  from = "/warm-intro"
  to = "/ask"
  status = 301
  force = true

# /healthcare-staff-scheduling pillar retired — consolidate equity into the nurse scheduling pillar
[[redirects]]
  from = "/healthcare-staff-scheduling"
  to = "/nurse-scheduling-software"
  status = 301
  force = true

# Old crawled non-/blog path for the scheduling-crisis post, 301 to the live post
[[redirects]]
  from = "/healthcare-scheduling-crisis-26000-administrative-burden"
  to = "/blog/healthcare-scheduling-crisis"
  status = 301
  force = true

# /pilot retired (free-pilot offer discontinued) — consolidate equity into /how-it-works
[[redirects]]
  from = "/pilot"
  to = "/how-it-works"
  status = 301
  force = true

# Catch-all: return true 404 status for unmatched URLs (prevents soft 404s)
[[redirects]]
  from = "/*"
  to = "/404"
  status = 404
