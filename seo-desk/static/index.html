<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SEO Desk</title>
    <!-- The saved theme is set before anything draws, so a light choice never flashes dark. -->
    <script>
      try {
        if (localStorage.getItem('seo-desk-theme') === 'light') document.documentElement.dataset.theme = 'light';
      } catch {
        // storage blocked: dark, the default
      }
    </script>
    <link rel="stylesheet" href="/app.css" />
    <link rel="icon" id="favicon" href="data:," />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#view">Skip to the page</a>
    <div class="shell">
      <aside class="side" id="side" aria-label="Desk menu">
        <div class="side-head">
          <a class="brand" href="#/week">
            <span class="brand-mark" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 16 16">
                <path
                  d="M2 12l4-4 3 3 5-6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            SEO Desk
          </a>
          <!-- While the menu is open on a narrow screen the page behind it is inert, so the panel
               carries its own way out. -->
          <button type="button" class="icon-btn side-close" id="side-close" aria-label="Close the menu" hidden>
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <nav class="side-nav" id="nav" aria-label="Pages"></nav>
        <div class="side-foot" id="side-foot"></div>
      </aside>
      <div class="side-scrim" id="scrim" hidden></div>
      <div class="main">
        <header class="topline">
          <button
            type="button"
            class="icon-btn menu-btn"
            id="menu-btn"
            aria-controls="side"
            aria-expanded="false"
            aria-label="Open the menu"
          >
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
          <a class="brand topline-brand" href="#/week">SEO Desk</a>
          <p class="standing">Search numbers show findability and credibility. They are not sales.</p>
          <div class="status" id="status">
            <span class="dots" id="dots" aria-label="How fresh each data source is"></span>
            <span id="through" class="num"></span>
            <button type="button" class="btn btn-small" id="refresh">Refresh now</button>
          </div>
        </header>
        <main class="page" id="view" tabindex="-1">
          <p class="loading">Loading the desk...</p>
        </main>
      </div>
    </div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  </body>
</html>
